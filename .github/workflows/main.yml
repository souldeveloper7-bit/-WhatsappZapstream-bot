name: Node.js CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run index.js
        run: node index.js
        timeout-minutes: 3
        continue-on-error: true   # don't fail when timeout kills the bot

      - name: Upload QR code artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-qr
          path: |
            qr.png
            qr.txt
          if-no-files-found: warn
          retention-days: 1
